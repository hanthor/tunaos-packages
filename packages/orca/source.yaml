policy: >-
  Preserve Ubuntu's complete source packaging, including unity-a11y.patch,
  Build-Depends, runtime relationships, install ownership and maintainer rules.
  Add only the maintained Tuna quilt patch and a downstream changelog entry.
  Ubuntu source checksums were retrieved from the primary archive; the orig and
  Debian archive hashes match Checksums-Sha256 in the pinned signed dsc.
  This provenance does not assert archive signature verification, successful
  native compilation, installed-package identity, or spoken password feedback.
retirement: >-
  Keep this recipe only while the target-native Orca lacks the corrected
  tuna-shell-gtk masked password-event handling. Re-evaluate against the
  Ubuntu source revision before upgrading or retiring the maintained patch;
  a version number alone does not prove that the behavioral gap has closed.
